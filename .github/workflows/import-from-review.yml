name: Import cinematic review codebase

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-from-review.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone approved review branch
        run: |
          git clone --depth 1 --branch visioncraft-cinematic-final-review-2026-09-12 \
            https://github.com/Visioncraft-Labs/visioncraft-labs-2026-09-09.git /tmp/source

      - name: Copy complete codebase
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github/workflows/import-from-review.yml' \
            /tmp/source/ ./

      - name: Commit imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Import complete VisionCraft cinematic final review"
            git push origin main
          fi
